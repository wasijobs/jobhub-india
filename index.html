<!DOCTYPE html>
<html>
<head>
<title>Wasi Jobs - JobHub India</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

header{
    background:#0b57d0;
    color:white;
    padding:25px;
    text-align:center;
}

nav{
    background:white;
    padding:15px;
    text-align:center;
}

nav a{
    margin:10px;
    text-decoration:none;
    color:#0b57d0;
    font-weight:bold;
}

.hero{
    padding:30px;
    text-align:center;
}

.search{
    width:80%;
    max-width:500px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 2px 8px #ddd;
}

button{
    background:#0b57d0;
    color:white;
    border:0;
    padding:10px 20px;
    border-radius:5px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>

<body>

<header>
<h1>Wasi Jobs</h1>
<p>Find Your Dream Job in India</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Jobs</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>

<section class="hero">
<h2>Search Jobs</h2>
<input class="search" placeholder="Search job title or location">
</section>

<div class="container">

<div class="card">
<h2>Latest Jobs</h2>
<p>Sales Executive</p>
<p>Telecaller</p>
<p>Field Sales Executive</p>
<button>Apply Now</button>
</div>

<div class="card">
<h2>Job Categories</h2>
<p>✔ Fresher Jobs</p>
<p>✔ Work From Home</p>
<p>✔ Sales Jobs</p>
<p>✔ Customer Support Jobs</p>
</div>

</div>

<footer>
<p>© 2026 Wasi Jobs - JobHub India</p>
</footer>

</body>
</html>
